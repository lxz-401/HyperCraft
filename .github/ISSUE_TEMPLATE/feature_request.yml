name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe your idea below.

  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - "Settings / UI"
        - "Home / Launcher hooks"
        - "SystemUI hooks (status bar, control center, etc.)"
        - "Native / C++ hooks"
        - "Safe mode / Crash handling"
        - "Backup & Restore"
        - "Scope management"
        - "Logging / Diagnostics"
        - "New hook target (app/system service)"
        - "Other / Not sure"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Why is it needed?
      placeholder: |
        Currently, users cannot...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Describe the feature in detail.
      placeholder: |
        Add a new setting/hook that...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds?
      placeholder: |
        Could also be done by...

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, references to other implementations, etc.
      placeholder: |
        Related: ...

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This feature is compatible with HyperCraft's scope (Xiaomi HyperOS/MIUI)
          required: true